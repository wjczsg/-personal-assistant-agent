services:
  agent:
    build: .
    image: personal-assistant-agent:dev
    container_name: personal-assistant-agent-persistent

    env_file:
      - .env

    environment:
      DATABASE_FILE: data/assistant.db

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - personal_assistant_db:/app/data
      - personal_assistant_chroma:/app/chroma_data

    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  nginx:
    image: nginx:alpine
    container_name: personal-assistant-nginx

    depends_on:
      - agent

    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5

volumes:
  personal_assistant_db:
    external: true

  personal_assistant_chroma:
    external: true
